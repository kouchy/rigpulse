site_name: RigPulse
site_description: Real-time telemetry HUD and remote power management for gaming rigs and workstations.
site_author: RigPulse Contributors

theme:
  name: material
  palette:
    - scheme: slate
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Overview: index.md
  - "Live Demo 🎮": https://kouchy.github.io/rigpulse/demo/
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration Reference: configuration.md
  - Agent Protocol v1.0: agent-protocol.md
  - FAQ & Troubleshooting: troubleshooting.md
